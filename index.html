<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DY-CRM系统 · 医疗营销数据驾驶舱</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d6fe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DY-CRM">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --sidebar-bg:#101c2e; --sidebar-active:#1d6fe0; --sidebar-text:#9fb0c7;
    --bg:#f2f5fa; --card:#ffffff; --line:#e6ebf2;
    --txt:#1f2d3d; --txt2:#8492a6;
    --blue:#1d6fe0; --red:#e64545; --green:#18a058; --orange:#e6a23c; --teal:#0e9f9f;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;}
  svg{display:block;}
  .layout{display:flex;min-height:100vh;}

  /* ============ 侧边栏 ============ */
  .sidebar{width:208px;background:var(--sidebar-bg);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 16px;color:#fff;font-size:16px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.06);}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1d6fe0,#0e9f9f);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav{flex:1;padding:10px 8px;overflow-y:auto;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:14px;color:var(--sidebar-text);transition:.15s;user-select:none;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#dbe6f5;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .sidebar-foot{padding:14px 16px;font-size:12px;color:#5b6b82;border-top:1px solid rgba(255,255,255,.06);}
  .sidebar-foot b{color:#9fb0c7;}

  /* ============ 主区域 ============ */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
  .topbar .title{font-size:17px;font-weight:700;}
  .topbar .spacer{flex:1;}
  .clock{font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#1d6fe0,#0e9f9f);padding:6px 14px;border-radius:20px;box-shadow:0 2px 8px rgba(29,111,224,.25);}
  .user-badge{background:#eaf2ff;color:var(--blue);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--txt);transition:.15s;min-height:36px;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{background:#1559b8;}
  .btn.danger{color:var(--red);}
  .btn.danger:hover{border-color:var(--red);}
  .content{padding:20px 22px;max-width:1440px;width:100%;margin:0 auto;}

  .sec-title{font-size:14px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
  .sec-title .dot{width:8px;height:8px;border-radius:2px;background:var(--red);display:inline-block;}
  .sec-title .dot.blue{background:var(--blue);}
  .sec-title .meta{font-size:12px;color:var(--txt2);font-weight:400;}

  /* 每日一言横幅 */
  @keyframes quoteIn{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:none;}}
  @keyframes quoteFlip{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
  .quote-banner{background:linear-gradient(110deg,#1d6fe0,#0e9f9f);border-radius:var(--radius);padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:8px;box-shadow:0 6px 20px rgba(29,111,224,.20);overflow:hidden;position:relative;animation:quoteIn .7s ease both;}
  .quote-banner:before{content:"";position:absolute;right:-26px;top:-34px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10);}
  .quote-banner:after{content:"";position:absolute;right:48px;bottom:-46px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.07);}
  .quote-banner .q-text{font-size:20px;font-weight:700;letter-spacing:1px;line-height:1.55;text-shadow:0 1px 3px rgba(0,0,0,.14);position:relative;z-index:1;}
  .quote-banner .q-text.q-anim{animation:quoteFlip .45s ease both;}
  .quote-banner .q-text:before{content:"\201C";font-size:30px;opacity:.55;margin-right:2px;vertical-align:-4px;}
  .quote-banner .q-text:after{content:"\201D";font-size:30px;opacity:.55;margin-left:2px;vertical-align:-9px;}
  .quote-banner .q-meta{text-align:right;flex-shrink:0;font-size:12px;opacity:.95;line-height:1.7;position:relative;z-index:1;}
  .quote-banner .q-meta .q-src{font-size:13px;font-weight:600;}
  .quote-banner .q-meta .q-date{margin-top:3px;}
  .quote-banner .q-flip{margin-top:9px;display:inline-block;cursor:pointer;font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:16px;padding:4px 13px;transition:.15s;user-select:none;}
  .quote-banner .q-flip:hover{background:rgba(255,255,255,.32);transform:translateY(-1px);}
  @media (max-width:900px){ .quote-banner{flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px;} .quote-banner .q-meta{text-align:left;} .quote-banner .q-text{font-size:17px;} .quote-banner .q-flip{margin-top:6px;} }

  /* KPI 卡片 */
  .kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.15s;position:relative;}
  .kpi:hover{box-shadow:0 4px 14px rgba(29,111,224,.12);transform:translateY(-2px);border-color:#c8dcff;}
  .kpi .label{font-size:12px;color:var(--txt2);display:flex;justify-content:space-between;align-items:center;}
  .kpi .label .arrow{width:14px;height:14px;opacity:.4;}
  .kpi .value{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .kpi .value small{font-size:13px;font-weight:500;color:var(--txt2);margin-left:2px;}
  .c-blue{color:var(--blue);} .c-red{color:var(--red);} .c-green{color:var(--green);}
  .c-orange{color:var(--orange);} .c-teal{color:var(--teal);} .c-dark{color:var(--txt);}

  /* 图表区 */
  .chart-row{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:12px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .panel h3{font-size:14px;font-weight:700;margin-bottom:4px;}
  .panel .legend{display:flex;gap:16px;font-size:12px;color:var(--txt2);margin:4px 0 8px;}
  .legend .lg{display:flex;align-items:center;gap:5px;}
  .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:860px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-head b{font-size:15px;}
  .modal-close{border:none;background:#f2f5fa;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--txt2);}
  .modal-close:hover{background:#e3e9f2;}
  .modal-body{padding:8px 20px 20px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;}
  th:first-child,td:first-child{text-align:left;}
  thead th{background:#f7f9fc;color:var(--txt2);font-weight:600;position:sticky;top:0;}
  tbody tr:hover{background:#f4f8ff;}
  tfoot td{font-weight:700;background:#f7f9fc;}
  .hl{color:var(--blue);font-weight:700;}

  /* 数据管理 */
  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;}
  .form-grid .field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px;}
  .form-grid input,.form-grid select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-family:inherit;background:#fff;}
  .form-grid input:focus,.form-grid select:focus{outline:none;border-color:var(--blue);}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
  .table-wrap{overflow-x:auto;}
  .tip-bar{background:#fff8e6;border:1px solid #ffe1a1;color:#946200;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;}
  .tip-bar.show{display:block;}

  /* 龙虎榜 */
  .rank-list{display:flex;flex-direction:column;gap:10px;}
  .rank-item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;cursor:pointer;transition:.15s;}
  .rank-item:hover{box-shadow:0 4px 14px rgba(29,111,224,.12);transform:translateY(-1px);border-color:#c8dcff;}
  .rank-no{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:#f0f3f8;color:var(--txt2);flex-shrink:0;}
  .rank-item.r1 .rank-no{background:linear-gradient(135deg,#f7b500,#e64500);color:#fff;}
  .rank-item.r2 .rank-no{background:linear-gradient(135deg,#9aa7b8,#5b6b82);color:#fff;}
  .rank-item.r3 .rank-no{background:linear-gradient(135deg,#d08a4e,#8a4b1f);color:#fff;}
  .rank-name{width:80px;font-weight:700;}
  .rank-bar{flex:1;height:14px;background:#f0f3f8;border-radius:7px;overflow:hidden;}
  .rank-bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#1d6fe0,#0e9f9f);}
  .rank-num{width:110px;text-align:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;}

  .empty{padding:60px 0;text-align:center;color:var(--txt2);}
  .placeholder{padding:80px 20px;text-align:center;color:var(--txt2);}
  .placeholder b{display:block;font-size:16px;color:var(--txt);margin-bottom:8px;}

  /* ============ 移动端 ============ */
  .mobile-nav{display:none;}
  @media (max-width:900px){
    .sidebar{display:none;}

    /* 顶栏：手机上只留标题 + 时钟，收起导出/导入/徽章，避免拥挤 */
    .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));gap:10px;}
    .topbar .spacer{display:none;}
    .topbar .btn{display:none;}
    .topbar .refresh-btn{display:inline-flex !important;align-items:center;gap:4px;}
    .topbar .user-badge{display:none;}
    .topbar .title{font-size:16px;}

    /* 底部固定 Tab 栏（App 化） */
    .mobile-nav{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
      background:var(--sidebar-bg);overflow-x:auto;overflow-y:hidden;
      padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:2px;
      box-shadow:0 -3px 14px rgba(0,0,0,.20);-webkit-overflow-scrolling:touch;
    }
    .mobile-nav .nav-item{
      flex:0 0 auto;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;padding:6px 11px;margin:0;font-size:11px;line-height:1.1;color:var(--sidebar-text);
    }
    .mobile-nav .nav-item svg{width:21px;height:21px;}
    .mobile-nav .nav-item.active{background:transparent;color:#fff;}
    .mobile-nav .nav-item.active svg{color:var(--blue);}
    .mobile-nav .nav-item.active{position:relative;}
    .mobile-nav .nav-item.active::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--blue);}
    .mobile-nav .nav-logout{display:none;}

    /* 内容让出底部 Tab 高度 */
    .content{padding:14px 14px 86px;}

    /* 栅格与组件适配 */
    .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .chart-row{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:repeat(2,1fr);gap:9px;}
    .kpi .value{font-size:21px;}
    .kpi .label{font-size:11px;}
    .sec-title{margin:16px 0 8px;font-size:13px;}

    /* 弹窗全屏化 */
    .mask{padding:0;}
    .modal{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;}
    .modal-head{padding:16px 16px calc(16px + env(safe-area-inset-top));}
    .modal-body{padding:6px 14px 24px;}
    table{font-size:12px;}
    th,td{padding:9px 8px;}
  }
  @media (min-width:901px) and (max-width:1200px){
    .kpi-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>

  <aside class="sidebar">

      <span class="mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 7v6c0 5 4 8.4 9 9 5-.6 9-4 9-9V7l-9-5Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12 8v6M9 11h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      DY-CRM系统
    </div>
    <nav class="nav" id="sideNav"></nav>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><b id="modalTitle">明细</b><button class="modal-close" onclick="closeModal()">✕</button></div>

<script>
/* ==================== 数据层 ==================== */
var LS_KEY = 'wb_medicrm_records_v5';
/* 云端数据源：GitHub 私密 Gist 的 raw 读取地址（公开可读、无需密钥）。占位，部署前替换为真实 URL */
var DATA_URL = 'https://gist.githubusercontent.com/ph19940401-star/1c72c901fdfae3c9bfcd1c10d54f9de4/raw/data.json';
var LS_OLD4 = 'wb_medicrm_records_v4';
var LS_OLD3 = 'wb_medicrm_records_v3';
var LS_OLD2 = 'wb_medicrm_records_v2';
var LS_OLD1 = 'wb_medicrm_records_v1';
var ORGS = ['天雄星','天立星','福州博润','天机星','金牛-黄V团队','天损星'];
var STAFF = ['陈敏','张语欣','齐雪莹','李林'];
var STAFF_W = {'陈敏':.30,'张语欣':.27,'齐雪莹':.23,'李林':.20};
/* 旧数据城市名 → 新渠道名 映射 */
var RENAME = {'哈尔滨':'天雄星','南京':'天立星','郑州':'福州博润','贵阳':'天机星','昆明':'金牛-黄V团队','成都':'天损星'};
var records = [];

/* 把一条渠道日汇总按客服权重拆成多条客服记录 */
function splitByStaff(row, rnd){
  var rows=[], acc={tot:0,val:0,push:0,book:0,arr:0};
  STAFF.forEach(function(st,si){
    var last = si===STAFF.length-1;
    var f = STAFF_W[st]*(0.85+0.3*rnd());
    var r2 = {date:row.date, org:row.org, staff:st};
    ['tot','val','push','book','arr'].forEach(function(k){
      r2[k] = last ? Math.max(0,(+row[k]||0)-acc[k]) : Math.round((+row[k]||0)*f);
      acc[k]+=r2[k];
    });
    rows.push(r2);
  });
  return rows;
}

function loadData(){
  try{ records = JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ records = []; }
  if(!records.length){
    try{
      /* 从 v4 直接迁移（已含客服维度） */
      var v4 = JSON.parse(localStorage.getItem(LS_OLD4)) || [];
      if(v4.length){
        records = v4.map(function(r,i){
          return {id:i+1,date:r.date,org:r.org,staff:r.staff||'',tot:+r.tot||0,val:+r.val||0,push:+r.push||0,book:+r.book||0,arr:+r.arr||0};
        });
      }else{
        /* 从 v3（渠道口径，无客服）迁移：按客服权重拆分 */
        var v3 = JSON.parse(localStorage.getItem(LS_OLD3)) || [];
        var v2 = [], v1 = [];
        if(!v3.length){
          v2 = JSON.parse(localStorage.getItem(LS_OLD2)) || [];
          if(v2.length){
            v3 = v2.map(function(r){ return {date:r.date,org:RENAME[r.org]||r.org,tot:+r.tot||0,val:+r.val||0,push:+r.push||0,book:+r.book||0,arr:+r.arr||0}; });
          }else{
            /* 从 v1（消费/核销口径）迁移 */
            v1 = JSON.parse(localStorage.getItem(LS_OLD1)) || [];
            if(v1.length){
              v3 = v1.map(function(r){
                var tot=+r.conv||0, val=Math.round(tot*0.8), push=Math.round(val*0.65);
                return {date:r.date,org:RENAME[r.org]||r.org,tot:tot,val:val,push:push,book:+r.hx||0,arr:+r.ry||0};
              });
            }
          }
        }
        if(v3.length){
          var rnd = seeded(42);
          records = [];
          v3.forEach(function(r){
            splitByStaff(r, rnd).forEach(function(row){ records.push(row); });
          });
          records.forEach(function(r,i){ r.id=i+1; });
        }
      }
    }catch(e){}
  }
  if(!records.length){ records = (typeof SEED_RECORDS!=='undefined' && SEED_RECORDS.length) ? SEED_RECORDS.map(function(r,i){ r.id=i+1; return r; }) : makeSample(); }
  saveData();
}

/* 从云端数据源拉取最新数据（公开读取地址，无需密钥）；失败则保留本地缓存/示例 */
async function pullCloud(){
  if(!DATA_URL || DATA_URL.indexOf('__GIST__')===0) return;
  try{
    var url = DATA_URL + (DATA_URL.indexOf('?')>=0 ? '&' : '?') + 't=' + Date.now();
    var res = await fetch(url, {cache:'no-store'});
    if(!res.ok) return;
    var d = await res.json();
    var changed = false;
    if(d.records && d.records.length){
      records = d.records.map(function(r,i){ r.id=i+1; return r; });
      saveData(); changed = true;
    }
    if(d.cs && d.cs.length){
      csRecords = d.cs.map(function(r,i){ r.id=i+1; return r; });
      saveCs(); changed = true;
    }
    if(changed){ route(); }
  }catch(e){ /* 离线或网络异常，保留本地缓存 */ }
}
function saveData(){ localStorage.setItem(LS_KEY, JSON.stringify(records)); }

/* 伪随机（稳定可复现） */
function seeded(s){ return function(){ s=(s*9301+49297)%233280; return s/233280; }; }

        var day = {date:'2026-'+('0'+mo).slice(-2)+'-'+(d<10?'0'+d:d), org:org, tot:tot, val:val, push:push, book:book, arr:arr};
        splitByStaff(day, rnd).forEach(function(row){ row.id=id++; out.push(row); });
      }
    }
  });
  return out;
}

var CS_OLD2 = 'wb_medicrm_cs_v2';
var CS_OLD = 'wb_medicrm_cs_v1';
var csRecords = [];

var CH_W = {'天雄星':.19,'天立星':.16,'福州博润':.20,'天机星':.18,'金牛-黄V团队':.14,'天损星':.13};

/* 把一条客服日汇总按渠道权重拆分 */
function splitCsByChannel(day, rnd){
  var rows=[], acc={tot:0,jt:0,jw:0,val:0};
  ORGS.forEach(function(org,oi){
    var last = oi===ORGS.length-1;
    var f = CH_W[org]*(0.8+0.4*rnd());
    var r2={date:day.date, staff:day.staff, org:org};
    ['tot','jt','jw','val'].forEach(function(k){
      r2[k] = last ? Math.max(0,(+day[k]||0)-acc[k]) : Math.round((+day[k]||0)*f);
      acc[k]+=r2[k];
    });
    if(r2.tot>0 || r2.val>0) rows.push(r2);
  });
  return rows;
}

function loadCs(){
  try{ csRecords = JSON.parse(localStorage.getItem(CS_LS)) || []; }catch(e){ csRecords = []; }
  if(!csRecords.length){
    try{
      /* 从 v2（已含渠道）直接迁移 */
      var v2 = JSON.parse(localStorage.getItem(CS_OLD2)) || [];
      if(v2.length){
        csRecords = v2.map(function(r,i){
          return {id:i+1,date:r.date,staff:r.staff,org:r.org||'',tot:+r.tot||0,jt:+r.jt||0,jw:+r.jw||0,val:+r.val||0};
        });
      }else{
        /* 从 v1（无渠道）迁移：按渠道权重拆分 */
        var old = JSON.parse(localStorage.getItem(CS_OLD)) || [];
        if(old.length){
          var rnd = seeded(99);
          csRecords = [];
          old.forEach(function(r){
            splitCsByChannel(r, rnd).forEach(function(row){ csRecords.push(row); });
          });
          csRecords.forEach(function(r,i){ r.id=i+1; });
        }
      }
    }catch(e){}
  }
  if(!csRecords.length){ csRecords = (typeof SEED_CS!=='undefined' && SEED_CS.length) ? SEED_CS.map(function(r,i){ r.id=i+1; return r; }) : makeCsSample(); }
  saveCs();
}

/* 客服外呼示例数据：4 客服 × 2026年1-8月 × 渠道拆分，口径：总数据→接通→加微→有效 */
function makeCsSample(){
  var season = [.92,.72,1.08,1.05,1.10,.98,1.02,1.06];
  var out=[], id=1;
  STAFF.forEach(function(st,si){
    var rnd=seeded(si*331+7);
    for(var mo=1; mo<=8; mo++){
      var days = new Date(2026, mo, 0).getDate();
      for(var d=1; d<=days; d++){
        var wave = (0.75 + 0.5*rnd() + (d>=25?0.1:0)) * season[mo-1];
        var tot = Math.max(10, Math.round((52+si*3)*wave));
        var jt  = Math.round(tot * (0.60+0.10*rnd()));   // 接通
        var jw  = Math.round(jt  * (0.50+0.12*rnd()));   // 加微
        var val = Math.round(jw  * (0.68+0.10*rnd()));   // 有效
        var day = {date:'2026-'+('0'+mo).slice(-2)+'-'+(d<10?'0'+d:d), staff:st, tot:tot, jt:jt, jw:jw, val:val};
        splitCsByChannel(day, rnd).forEach(function(row){ row.id=id++; out.push(row); });
      }
    }
  });
  return out;
}
function csSum(list){
  var s={tot:0,jt:0,jw:0,val:0};
  list.forEach(function(r){ s.tot+=r.tot; s.jt+=r.jt; s.jw+=r.jw; s.val+=r.val; });
  s.jtr = s.tot? s.jt/s.tot*100 : 0;   // 接通率 = 接通 ÷ 总数据
  s.jwr = s.jt?  s.jw/s.jt*100  : 0;   // 加微率 = 加微 ÷ 接通
  s.vr  = s.jw?  s.val/s.jw*100 : 0;   // 有效率 = 有效 ÷ 加微
  return s;
}

function latestDate(){
  var max=''; records.forEach(function(r){ if(r.date>max) max=r.date; });
  return max || todayStr();
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function sum(list){
  var s={tot:0,val:0,push:0,book:0,arr:0};
  list.forEach(function(r){ s.tot+=r.tot; s.val+=r.val; s.push+=r.push; s.book+=r.book; s.arr+=r.arr; });
  s.cvrt = s.tot? s.arr/s.tot*100 : 0;    // 总转化 = 到诊 ÷ 总数据
  return s;
}

function dailyQuote(){
  var now=new Date();
  var start=new Date(now.getFullYear(),0,0);
  var doy=Math.floor((now-start)/86400000);          // 一年中的第几天
  var idx=(doy*7 + now.getFullYear()) % DAILY_QUOTES.length;  // 相邻天不同，逐年偏移
  return DAILY_QUOTES[idx];
}
function todayLabel(){
  var d=new Date(), p=function(n){return ('0'+n).slice(-2);};
  var wk=['日','一','二','三','四','五','六'][d.getDay()];
  return d.getFullYear()+'年'+p(d.getMonth()+1)+'月'+p(d.getDate())+'日 星期'+wk;
}
function flipQuote(){
  var banner=document.querySelector('.quote-banner');
  if(!banner) return;
  var txt=banner.querySelector('.q-text'), src=banner.querySelector('.q-src');
  if(!txt) return;
  var idx=Math.floor(Math.random()*DAILY_QUOTES.length);
  var q=DAILY_QUOTES[idx];
  txt.textContent=q.t;
  if(src) src.textContent=q.s;
  txt.classList.remove('q-anim'); void txt.offsetWidth; txt.classList.add('q-anim');
}

function renderDashboard(){
  var ld = latestDate();
  var month = ld.slice(0,7);
  var dayList  = records.filter(function(r){return r.date===ld;});
  var monList  = records.filter(function(r){return r.date.slice(0,7)===month;});
  var D = sum(dayList), M = sum(monList);
  var daysInMonth = new Date(+month.slice(0,4), +month.slice(5,7), 0).getDate();

  var q=dailyQuote();
  var html = '';
  /* 每日一言横幅 */
  html += '<div class="quote-banner">'
    + '<div class="q-text">'+q.t+'</div>'
    + '<div class="q-meta"><div class="q-src">'+q.s+'</div><div class="q-flip" onclick="flipQuote()">换一句 ↻</div></div>'
    + '</div>';
  /* 当日汇总 */
  html += '<div class="sec-title"><span class="dot"></span>当日汇总 <span class="meta">'+ld+'（最新数据日）· 点击卡片查看各渠道明细</span></div>';
  html += '<div class="kpi-grid">'
    + kpi('总数据', D.tot.toLocaleString(), 'c-blue',  'day','tot')
    + kpi('有效',   D.val.toLocaleString(), 'c-dark',  'day','val')
    + kpi('推进',   D.push.toLocaleString(),'c-orange','day','push')
    + kpi('预约',   D.book.toLocaleString(),'c-teal',  'day','book')
    + kpi('到诊',   D.arr+'<small>人</small>','c-red', 'day','arr')
    + kpi('总转化', fmtPct(D.cvrt),         'c-green', 'day','cvrt')
    + '</div>';

  /* 当月汇总 */
  html += '<div class="sec-title"><span class="dot blue"></span>当月汇总 <span class="meta">'+month+' · 已统计 '+daysInMonth+' 天</span></div>';
  html += '<div class="kpi-grid">'
    + kpi('月总数据', M.tot.toLocaleString(),  'c-blue',  'mon','tot')
    + kpi('月有效',   M.val.toLocaleString(),  'c-dark',  'mon','val')
    + kpi('月推进',   M.push.toLocaleString(), 'c-orange','mon','push')
    + kpi('月预约',   M.book.toLocaleString(), 'c-teal',  'mon','book')
    + kpi('月到诊',   M.arr.toLocaleString()+'<small>人</small>','c-red','mon','arr')
    + kpi('月总转化', fmtPct(M.cvrt),          'c-green', 'mon','cvrt')
    + '</div>';

  /* 图表行 */
  html += '<div class="chart-row">'
    + '<div class="panel"><h3>近 7 日总数据 / 到诊趋势</h3>'
    + '<div class="legend"><span class="lg"><i class="sw" style="background:#1d6fe0"></i>总数据</span><span class="lg"><i class="sw" style="background:#e6a23c"></i>到诊</span></div>'
    + '<div id="trendChart"></div></div>'
    + '<div class="panel"><h3>'+ld+' · 各渠道到诊</h3><div class="legend"><span class="lg"><i class="sw" style="background:#0e9f9f"></i>当日到诊（人）</span></div>'
    + '<div id="orgChart"></div></div>'
    + '</div>';

  setView('仪表盘', html);
  drawTrend(ld);
  drawOrgBars(ld);
}

/* 近 7 日 组合图：柱=总数据（左轴） 折线=到诊（右轴） */
function drawTrend(ld){
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date(ld+'T00:00:00'); d.setDate(d.getDate()-i);
    days.push(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2));
  }
  var data = days.map(function(day){
    var s = sum(records.filter(function(r){return r.date===day;}));
    return {day:day.slice(5), tot:s.tot, arr:s.arr};
  });
  var W=620,H=260,pl=48,pr=40,pt=16,pb=34;
  var cw=(W-pl-pr)/data.length;
  var maxTot=Math.max.apply(null,data.map(function(d){return d.tot;}))*1.15 || 1;
  var maxArr=Math.max.apply(null,data.map(function(d){return d.arr;}))*1.3 || 1;

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  for(var g=0;g<=4;g++){
    var y=pt+(H-pt-pb)*g/4;
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#eef2f7"/>';
    var v=Math.round(maxTot*(1-g/4));
    s+='<text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#8492a6">'+v+'</text>';
    var hv=Math.round(maxArr*(1-g/4));
    s+='<text x="'+(W-pr+8)+'" y="'+(y+4)+'" font-size="10" fill="#e6a23c">'+hv+'</text>';
  }
  var pts=[];
  data.forEach(function(d,i){
    var x=pl+cw*i+cw/2;
    var bh=(H-pt-pb)*d.tot/maxTot;
    s+='<rect x="'+(x-cw*0.26)+'" y="'+(H-pb-bh)+'" width="'+(cw*0.52)+'" height="'+bh+'" rx="3" fill="#1d6fe0"><title>'+d.day+' 总数据 '+d.tot+'</title></rect>';
    var y=H-pb-(H-pt-pb)*d.arr/maxArr;
    pts.push([x,y]);
    s+='<text x="'+x+'" y="'+(H-pb+16)+'" text-anchor="middle" font-size="10" fill="#8492a6">'+d.day+'</text>';
  });
  var path=pts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1];}).join(' ');
  s+='<path d="'+path+'" fill="none" stroke="#e6a23c" stroke-width="2.5"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#fff" stroke="#e6a23c" stroke-width="2"><title>'+data[i].day+' 到诊 '+data[i].arr+'</title></circle>';
  });
  s+='</svg>';
  document.getElementById('trendChart').innerHTML=s;
}

/* 各渠道到诊横向柱状图（当日） */
function drawOrgBars(ld){
  var rows = ORGS.map(function(org){
    var s=sum(records.filter(function(r){return r.date===ld && r.org===org;}));
    return {org:org, arr:s.arr};
  }).sort(function(a,b){return b.arr-a.arr;});
  var max=Math.max.apply(null,rows.map(function(r){return r.arr;})) || 1;
  var W=460, rh=34, H=rows.length*rh+10, pl=110, pr=60;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  rows.forEach(function(r,i){
    var y=i*rh+8, bw=(W-pl-pr)*r.arr/max;
    s+='<text x="'+(pl-8)+'" y="'+(y+13)+'" text-anchor="end" font-size="12" fill="#1f2d3d">'+r.org+'</text>';
    s+='<rect x="'+pl+'" y="'+y+'" width="'+Math.max(bw,2)+'" height="18" rx="4" fill="#0e9f9f"><title>'+r.org+' 到诊 '+r.arr+' 人</title></rect>';
    s+='<text x="'+(pl+bw+8)+'" y="'+(y+13)+'" font-size="11" fill="#0e9f9f" font-weight="700">'+r.arr+' 人</text>';
  });
  s+='</svg>';

  val: {name:'有效',   get:function(s){return s.val;},  fmt:function(s){return s.val.toLocaleString();}},
  push:{name:'推进',   get:function(s){return s.push;}, fmt:function(s){return s.push.toLocaleString();}},
  book:{name:'预约',   get:function(s){return s.book;}, fmt:function(s){return s.book.toLocaleString();}},
  arr: {name:'到诊',   get:function(s){return s.arr;},  fmt:function(s){return s.arr.toLocaleString();}},
  cvrt:{name:'总转化', get:function(s){return s.cvrt;}, fmt:function(s){return fmtPct(s.cvrt);}}
};
function openDetail(scope, metric, label){
  var ld=latestDate(), month=ld.slice(0,7);
  var list = records.filter(function(r){ return scope==='day'? r.date===ld : r.date.slice(0,7)===month; });
  var rows = ORGS.map(function(org){
    var s=sum(list.filter(function(r){return r.org===org;}));
    return {org:org, s:s};
  });
  var m=METRICS[metric];
  rows.sort(function(a,b){return m.get(b.s)-m.get(a.s);});
  var T=sum(list);

  document.getElementById('modalTitle').textContent =
    (scope==='day'? ld+' · 日' : month+' · 月') + m.name + ' — 各渠道明细';

  var h='<div class="table-wrap"><table><thead><tr>'
    +'<th>渠道</th><th>总数据</th><th>有效</th><th>推进</th><th>预约</th><th>到诊</th><th>总转化</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var cell=function(key,val){ return '<td class="'+(key===metric?'hl':'')+'">'+val+'</td>'; };
    h+='<tr><td>'+r.org+'</td>'
      +cell('tot',  r.s.tot.toLocaleString())
      +cell('val',  r.s.val.toLocaleString())
      +cell('push', r.s.push.toLocaleString())
      +cell('book', r.s.book.toLocaleString())
      +cell('arr',  r.s.arr.toLocaleString())
      +cell('cvrt', fmtPct(r.s.cvrt))+'</tr>';
  });
  h+='</tbody><tfoot><tr><td>合计</td>'
    +'<td class="'+(metric==='tot'?'hl':'')+'">'+T.tot.toLocaleString()+'</td>'
    +'<td class="'+(metric==='val'?'hl':'')+'">'+T.val.toLocaleString()+'</td>'
    +'<td class="'+(metric==='push'?'hl':'')+'">'+T.push.toLocaleString()+'</td>'
    +'<td class="'+(metric==='book'?'hl':'')+'">'+T.book.toLocaleString()+'</td>'
    +'<td class="'+(metric==='arr'?'hl':'')+'">'+T.arr.toLocaleString()+'</td>'
    +'<td class="'+(metric==='cvrt'?'hl':'')+'">'+fmtPct(T.cvrt)+'</td></tr></tfoot></table></div>';
  document.getElementById('modalBody').innerHTML=h;
  document.getElementById('mask').classList.add('show');
  animateNumbers(document.getElementById('modalBody'));
}

function field(label,inner){ return '<div class="field"><label>'+label+'</label>'+inner+'</div>'; }

function renderRecRows(){
  var sorted=records.slice().sort(function(a,b){
    return b.date===a.date ? ORGS.indexOf(a.org)-ORGS.indexOf(b.org) : (b.date<a.date?-1:1);
  });
  var h='';
  sorted.slice(0,300).forEach(function(r){
    var s=sum([r]);
    h+='<tr><td>'+r.date+'</td><td>'+r.org+'</td><td>'+(r.staff||'-')+'</td><td>'+r.tot+'</td><td>'+r.val+'</td>'

      +'<td><button class="btn danger" style="padding:4px 10px;min-height:30px" onclick="delRecord('+r.id+')">删除</button></td></tr>';
  });
  document.getElementById('recTbody').innerHTML = h || '<tr><td colspan="10" class="empty">暂无数据，请先录入</td></tr>';
}
function addRecord(){
  var g=function(id){return document.getElementById(id).value;};
  var date=g('f_date'), org=g('f_org'), staff=g('f_staff');
  var tot=+g('f_tot')||0, val=+g('f_val')||0, push=+g('f_push')||0, book=+g('f_book')||0, arr=+g('f_arr')||0;
  if(!date){ alert('请选择日期'); return; }
  if(tot+val+push+book+arr===0){ alert('请至少填写一项数据'); return; }
  var exist=records.find(function(r){return r.date===date && r.org===org && r.staff===staff;});
  if(exist){ exist.tot=tot; exist.val=val; exist.push=push; exist.book=book; exist.arr=arr; }
  else{
    var nid=records.reduce(function(m,r){return Math.max(m,r.id);},0)+1;
    records.push({id:nid,date:date,org:org,staff:staff,tot:tot,val:val,push:push,book:book,arr:arr});
  }
  saveData(); renderManage();
}
function delRecord(id){
  records=records.filter(function(r){return r.id!==id;});
  saveData(); renderRecRows();
}
function clearSample(){
  if(!confirm('确定清空示例数据并从头开始录入吗？'))return;
  records=[]; saveData(); renderManage();
}
function clearAll(){
  if(!confirm('⚠️ 将删除全部 '+records.length+' 条数据，此操作不可恢复！\n建议先「导出 JSON」备份。确定继续吗？'))return;
  if(!confirm('再次确认：真的要清空全部数据吗？'))return;
  records=[]; saveData(); renderManage();
}

/* ==================== 视图：盈亏分析 ==================== */
var profitPeriod = 'mon'; // day | mon | year
function setProfitPeriod(p){ profitPeriod=p; renderProfit(); }

function fmtMoney(n){
  return n.toLocaleString('zh-CN',{maximumFractionDigits:0});
}
function profitKpi(label, value, cls){
  return '<div class="kpi"><div class="label">'+label+'</div><div class="value '+cls+'">'+value+'</div></div>';
}

function renderProfit(){
  var ld=latestDate(), month=ld.slice(0,7), year=ld.slice(0,4);
  var label, list;
  var daysInMonth = new Date(+year, +month.slice(5,7), 0).getDate();
  var staffCount = STAFF.length;
  var perCost;
  if(profitPeriod==='day'){
    label='当日（'+ld+'）'; list=records.filter(function(r){return r.date===ld;});
    perCost = 10000 / daysInMonth;
  }else if(profitPeriod==='mon'){
    label='当月（'+month+'）'; list=records.filter(function(r){return r.date.slice(0,7)===month;});
    perCost = 10000;
  }else{
    label='年度（'+year+'）'; list=records.filter(function(r){return r.date.slice(0,4)===year;});
    perCost = 120000;
  }
  var totalCost = perCost * staffCount;

  function calc(arr){
    var s = sum(arr);
    var income = s.arr * 2150;
    var cost = totalCost;        // 团队固定成本
    var profit = income - cost;
    return {
      arr: s.arr,
      income: income,
      cost: cost,
      profit: profit,
      margin: income? profit/income*100 : (profit? -100 : 0),
      perArr: staffCount? s.arr/staffCount : 0,
      perIncome: staffCount? income/staffCount : 0,
      perProfit: staffCount? profit/staffCount : 0
    };
  }

  var T = calc(list);
  var pbtn=function(p,n){ return '<button class="btn'+(profitPeriod===p?' primary':'')+'" onclick="setProfitPeriod(\''+p+'\')">'+n+'</button>'; };

  var h='<div class="toolbar" style="margin:0 0 14px 0">'+pbtn('mon','当月')+pbtn('year','年度')+'</div>';

  h+='<div class="sec-title"><span class="dot"></span>团队盈亏总览 <span class="meta">'+label+' · 收入=到诊×¥2150 · 成本='+staffCount+'人×¥'+fmtMoney(perCost)+'</span></div>'
    +'<div class="kpi-grid">'
    +profitKpi('到诊数', T.arr.toLocaleString()+'<small>人</small>', 'c-red')
    +profitKpi('收入', '¥'+fmtMoney(T.income), 'c-blue')
    +profitKpi('成本', '¥'+fmtMoney(T.cost), 'c-orange')
    +profitKpi('人效', '¥'+fmtMoney(T.perProfit), T.profit>=0?'c-green':'c-red')
    +'</div>';

  h+='<div class="sec-title"><span class="dot blue"></span>客服盈亏明细 <span class="meta">按人效排序 · 人效=该客服利润</span></div>'
    +'<div class="panel"><div class="table-wrap"><table><thead><tr>'
    +'<th>客服</th><th>到诊</th><th>收入</th><th>成本分摊</th><th>人效</th>'
    +'</tr></thead><tbody>';

  var rows=STAFF.map(function(st){
    var r=calc(list.filter(function(r){return r.staff===st;}));
    r.staff=st; return r;
  }).sort(function(a,b){return b.perProfit-a.perProfit;});

  rows.forEach(function(r){
    var profCls = r.profit>=0?'hl':'';
    h+='<tr><td>'+r.staff+'</td><td>'+r.arr+'</td><td>¥'+fmtMoney(r.income)+'</td>'
      +'<td>¥'+fmtMoney(perCost)+'</td><td class="'+profCls+'">¥'+fmtMoney(r.perProfit)+'</td></tr>';
  });

  h+='</tbody><tfoot><tr><td>团队合计</td><td>'+T.arr+'</td><td>¥'+fmtMoney(T.income)+'</td>'
    +'<td>¥'+fmtMoney(T.cost)+'</td><td class="hl">¥'+fmtMoney(T.perProfit)+'</td></tr></tfoot></table></div></div>';

  setView('盈亏分析', h);
}

/* ==================== 导入导出 ==================== */
function exportJSON(){
  var blob=new Blob([JSON.stringify({records:records, cs:csRecords},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='DY-CRM数据_'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(ev){
  var f=ev.target.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var data=JSON.parse(rd.result);
      var arr = Array.isArray(data)? data : (data.records||[]);
      var cs  = Array.isArray(data)? []   : (data.cs||[]);
      arr=arr.filter(function(r){return r.date&&r.org;}).map(function(r,i){
        return {id:i+1,date:r.date,org:r.org,staff:r.staff||'',tot:+r.tot||0,val:+r.val||0,push:+r.push||0,book:+r.book||0,arr:+r.arr||0};
      });
      cs=cs.filter(function(r){return r.date&&r.staff;}).map(function(r,i){
        return {id:i+1,date:r.date,staff:r.staff,org:r.org||'',tot:+r.tot||0,jt:+r.jt||0,jw:+r.jw||0,val:+r.val||0};
      });
      if(!arr.length && !cs.length) throw 0;
      if(arr.length){ records=arr; saveData(); }
      if(cs.length){ csRecords=cs; saveCs(); }
      route();
      alert('导入成功：漏斗数据 '+arr.length+' 条，客服数据 '+cs.length+' 条');
    }catch(e){ alert('文件格式不正确，导入失败'); }
  };
  rd.readAsText(f); ev.target.value='';
}

  var head='日期,渠道,客服,总数据,有效,推进,预约,到诊\n';

  var blob=new Blob(['﻿'+head+body],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='DY-CRM数据_'+todayStr()+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

    var n=NAV.find(function(x){return x.id===cur;});
    setView(n.name,'<div class="panel"><div class="placeholder"><b>「'+n.name+'」模块建设中</b>已交付仪表盘 / 数据管理 / 龙虎榜 / 客服数据 / 年度数据 / 固定资产 / 盈亏分析六大模块，此模块将在下个迭代追加。</div></div>');
  }
}
function setView(title,html){
  document.getElementById('pageTitle').textContent=title;
  document.getElementById('content').innerHTML=html;
  window.scrollTo(0,0);
  animateNumbers(document.getElementById('content'));
}

/* ==================== 数字滚动增长动画 ==================== */
function parseNum(str){
  var m=str.match(/^([^\d\-]*)(-?[\d.,]+)(.*)$/);
  if(!m || m[2]==='') return null;
  var dec=(m[2].split('.')[1]||'').length;
  return {prefix:m[1], val:parseFloat(m[2].replace(/,/g,'')), suffix:m[3], dec:dec};
}
function fmtN(v,dec){
  return v.toLocaleString('zh-CN',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function countUp(span,dur){
  var info=parseNum(span.dataset.target);
  if(!info || isNaN(info.val)) return;
  var start=null;
  function frame(ts){
    if(start===null) start=ts;
    var p=Math.min((ts-start)/dur,1);
    var e=1-Math.pow(1-p,3);   // easeOutCubic 缓动
    var cur=info.val*e;
    span.textContent=info.prefix + fmtN(cur, info.dec) + info.suffix;
    if(p<1) requestAnimationFrame(frame);
    else span.textContent=info.prefix + fmtN(info.val, info.dec) + info.suffix;
  }
  requestAnimationFrame(frame);
}
function animateNumbers(root){
  if(!root) return;
  var dur=850;
  /* KPI 卡片：数字可能含 <small> 单位，保留包裹 */
  root.querySelectorAll('.kpi .value').forEach(function(el){
    var m=el.innerHTML.match(/(-?[\d,]+(\.\d+)?)/);
    if(!m) return;
    var pre=el.innerHTML.slice(0,m.index);
    var num=m[0];
    var post=el.innerHTML.slice(m.index+num.length);
    el.innerHTML=pre+'<span class="cnt" data-target="'+num+'">'+num+'</span>'+post;
  });
  /* 龙虎榜数字 */
  root.querySelectorAll('.rank-num').forEach(function(el){
    var txt=el.childNodes[0];
    if(txt && txt.nodeType===3){
      var t=txt.textContent.trim();
      if(/^¥?-?[\d,]+(\.\d+)?(人|%)?$/.test(t)){
        var sp=document.createElement('span');
        sp.className='cnt'; sp.dataset.target=t; sp.textContent=t;
        el.replaceChild(sp, txt);
      }
    }
  });
  /* 表格单元格：纯数字 / ¥ / % / 人 */
  root.querySelectorAll('td').forEach(function(td){
    var t=td.textContent.trim();
    if(/^¥?-?[\d,]+(\.\d+)?(人|%)?$/.test(t)){
      td.innerHTML='<span class="cnt" data-target="'+t+'">'+t+'</span>';
    }
  });
  root.querySelectorAll('span.cnt').forEach(function(s){ countUp(s,dur); });
}

/* 时钟 */
function tick(){
  var d=new Date(), p=function(n){return ('0'+n).slice(-2);};
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('clock').textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+wk+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
setInterval(tick,1000); tick();
